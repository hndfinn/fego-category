[features]
multi_agent = true

[agents]
max_threads = 5

[agents.category_research]
description = "Read category/product sources and establish evidence, facts and uncertainties."
config_file = "agents/category_research.toml"

[agents.category_framework]
description = "Fit the current category template/sections and plan the Google Doc draft copy and section-mapped images."
config_file = "agents/category_framework.toml"

[agents.category_seo]
description = "Review the user's Gemini-returned draft for metadata, headings, links and implementation issues without rewriting the voice."
config_file = "agents/category_seo.toml"

[agents.category_qa]
description = "Independently verify target, media mapping, backup, deployment artifacts and public-page evidence."
config_file = "agents/category_qa.toml"
